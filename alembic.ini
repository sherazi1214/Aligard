[alembic]
script_location = backend/migrations
# DB URL yahan nahi: env.py DATABASE_URL (.env) se leta hai

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
