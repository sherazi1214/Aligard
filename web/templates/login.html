{% extends "base.html" %}{% from "_pw.html" import password_field %}
{% block title %}Login{% endblock %}{% block heading %}Login{% endblock %}
{% block content %}
<form data-endpoint="/api/auth/login" data-next="/dashboard" data-next-2fa="/login/2fa" novalidate>
  <div class="field"><label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required maxlength="254"></div>
  {{ password_field("password", "Password", "current-password") }}
  <button type="submit">Login</button>
</form>
<p><a href="/forgot-password">Password bhool gaye?</a> · <a href="/signup">Naya account</a></p>
{% endblock %}
